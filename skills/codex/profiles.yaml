# Permission profiles for Codex CLI delegation.
# Always pass an explicit sandbox (exec: --sandbox; review: -c sandbox_mode=…).
# Sandbox is the OS/FS boundary for model-generated commands.

profiles:
  review:
    purpose: code/design/security review; static bug hunt
    command: review
    sandbox: read-only
    writable: false

  verify:
    purpose: build, test, lint, static analysis, reproduce
    command: exec
    sandbox: workspace-write
    # workspace-write can rewrite files; prompt "do not edit" is not a technical guarantee
    writable: true
    # After the run: compare status + content hashes/diffs (incl. already-dirty paths);
    # prefer a disposable worktree; note ignored-output limits

  implement:
    purpose: feature, fix, refactor, add tests (user must ask explicitly)
    command: exec
    sandbox: workspace-write
    writable: true

  smoke:
    purpose: connectivity / auth check only
    command: exec
    sandbox: read-only
    writable: false
