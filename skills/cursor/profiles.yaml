# Cursor Agent permission profiles.
# `--force` auto-approves tools; force=true is shell/file writable.

profiles:
  review:
    purpose: code/design/security review; static bug hunt
    mode: ask
    sandbox: enabled
    force: false
    writable: false

  verify:
    purpose: build, test, lint, static analysis, reproduce
    mode: agent
    sandbox: enabled
    force: true
    writable: true
    workspace: worktree-preferred

  implement:
    purpose: feature, fix, refactor, add tests (user must ask explicitly)
    mode: agent
    sandbox: enabled
    force: true
    writable: true

  smoke:
    purpose: connectivity / auth check only
    mode: ask
    sandbox: enabled
    force: false
    writable: false
